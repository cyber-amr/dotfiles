# See sysctl.conf(5)

# Open File & Epoll Limits
fs.file-max = 2097152
fs.nr_open = 2097152
fs.epoll.max_user_watches = 10485760

# Port Range & Connection Reuse
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_syn_backlog = 65535
net.core.somaxconn = 65535

# TCP Memory Page Allocation (min / default / max in 4KB pages)
# 256 MiB / 0.75 GiB / 1.5 GiB
net.ipv4.tcp_mem = 65536 196608 393216

# TCP Read & Write Buffers (min / default / max in bytes)
net.ipv4.tcp_rmem = 1024 4096 16777216
net.ipv4.tcp_wmem = 1024 4096 16777216

# Socket Backlog & Drop Safeguards
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_orphans = 262144
